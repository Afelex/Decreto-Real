<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" role="img" aria-label="Cinta roja del jugador">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2=".18" y2="1" gradientUnits="objectBoundingBox">
    <stop stop-color="#fff5ab"/><stop offset=".12" stop-color="#ffd82c"/><stop offset=".29" stop-color="#a95008"/>
    <stop offset=".49" stop-color="#fff29a"/><stop offset=".63" stop-color="#f6ba24"/>
    <stop offset=".83" stop-color="#92500a"/><stop offset="1" stop-color="#f9c43d"/>
  </linearGradient>
  <linearGradient id="satin" x1=".1" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
    <stop stop-color="#59020c"/><stop offset=".26" stop-color="#e61c20"/>
    <stop offset=".51" stop-color="#a40b14"/><stop offset=".78" stop-color="#e61c20"/><stop offset="1" stop-color="#4a030b"/>
  </linearGradient>
  <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".3"/><stop offset=".38" stop-color="#ffffff" stop-opacity=".06"/>
    <stop offset=".68" stop-color="#081234" stop-opacity=".04"/><stop offset="1" stop-color="#000317" stop-opacity=".33"/>
  </linearGradient>
  <filter id="shadow" x="-8%" y="-20%" width="116%" height="155%">
    <feDropShadow dx="2" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity=".56"/>
  </filter>
</defs>
<g transform="translate(1024 0) scale(-1 1)" filter="url(#shadow)" stroke-linejoin="round">
  <!-- Two chevron-cut tails behind the folded central panel. -->
  <path d="M22 91 241 116 200 179 266 244 9 204 85 154Z" fill="url(#satin)" stroke="#9d5409" stroke-width="22"/>
  <path d="M22 91 241 116 200 179 266 244 9 204 85 154Z" fill="none" stroke="url(#metal)" stroke-width="14"/>
  <path d="M784 126 1012 192 946 241 1001 305 784 260Z" fill="url(#satin)" stroke="#8c4708" stroke-width="22"/>
  <path d="M784 126 1012 192 946 241 1001 305 784 260Z" fill="none" stroke="url(#metal)" stroke-width="14"/>
  <!-- Slanted front panel with rounded gold piping. -->
  <path d="M96 31 Q103 17 120 23 L856 112 Q902 116 920 150 L948 259 Q955 278 937 275 L158 191 Q144 187 141 167Z"
    fill="url(#satin)" stroke="#80420b" stroke-width="24"/>
  <path d="M96 31 Q103 17 120 23 L856 112 Q902 116 920 150 L948 259 Q955 278 937 275 L158 191 Q144 187 141 167Z"
    fill="url(#glaze)" stroke="url(#metal)" stroke-width="16"/>
