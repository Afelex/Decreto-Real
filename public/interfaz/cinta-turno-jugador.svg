  <path d="M106 29 Q113 23 123 28 L862 119 Q894 124 910 151" fill="none" stroke="#fff7c2" stroke-width="3.3" opacity=".86"/>
  <path d="M152 180 Q157 184 176 186 L925 268" fill="none" stroke="#ffe27b" stroke-width="4" opacity=".95"/>
  <path d="M147 170 Q162 157 183 172 L218 205 Q185 205 165 191Z" fill="#060b25" opacity=".43"/>
  <path d="M911 244 Q931 252 948 259" fill="none" stroke="#ffed88" stroke-width="7" opacity=".8"/>
</g></svg>