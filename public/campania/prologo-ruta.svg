<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
<title id="title">Los primeros caminos: prólogo de Decreto Real</title>
<desc id="desc">Mapa ilustrado de un valle de la costa andina, con un puerto, caminos, montañas y dos fortalezas virreinales. Sin textos ni marcadores de misión.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#557b95"/><stop offset=".45" stop-color="#b8b1a0"/><stop offset=".8" stop-color="#edd4a2"/><stop offset="1" stop-color="#c69b6d"/></linearGradient>
 <radialGradient id="haze" cx=".68" cy=".23" r=".56"><stop stop-color="#ffefbb" stop-opacity=".96"/><stop offset=".49" stop-color="#edc487" stop-opacity=".42"/><stop offset="1" stop-color="#c18e5d" stop-opacity="0"/></radialGradient>
 <linearGradient id="sea" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#5d98a5"/><stop offset=".5" stop-color="#79aca9"/><stop offset="1" stop-color="#315e75"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cfb17c"/><stop offset=".42" stop-color="#c3935d"/><stop offset="1" stop-color="#805d43"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbe8b8" stop-opacity=".07"/><stop offset="1" stop-color="#5d381d" stop-opacity=".24"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2c59a"/><stop offset="1" stop-color="#805b46"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5dc9f"/><stop offset="1" stop-color="#9d704b"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#34251c" flood-opacity=".45"/></filter>
 <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M6 9h2M18 28h1M36 13h1M29 37h2" stroke="#543b25" stroke-width="1.5" opacity=".15"/></pattern>
 <pattern id="waves" width="84" height="56" patternUnits="userSpaceOnUse"><path d="M1 19q13 -9 25 0t25 0t25 0M10 45q12 -8 24 0t24 0" fill="none" stroke="#d6e3c3" stroke-width="2" opacity=".3"/></pattern>
</defs>
<!-- dawn and distant mountains -->
<rect width="768" height="1120" fill="url(#sky)"/>
<rect width="768" height="1120" fill="url(#haze)"/>
<ellipse cx="556" cy="190" rx="116" ry="87" fill="#fff5d0" opacity=".28" filter="url(#blur)"/>
<circle cx="568" cy="178" r="52" fill="#fff2c8" opacity=".93"/>
<circle cx="568" cy="178" r="58" fill="none" stroke="#fff1ca" stroke-width="5" opacity=".28"/>
<path d="M0 342 60 296 116 327 210 210 288 290 352 231 452 320 547 229 624 298 710 246 768 307V686H0Z" fill="#80909a" opacity=".56"/>
<path d="m126 316 84-106 79 80-50-15-32-43-34 58zM485 300l62-71 77 69-40-12-36-32-27 40z" fill="#ede7d2" opacity=".52"/>
<path d="M0 414 108 357 198 399 293 311 391 382 463 341 549 408 633 331 768 413V840H0Z" fill="#7f8279" opacity=".48"/>
<path d="M0 516 72 450 160 468 234 404 311 452 376 415 492 476 608 416 685 461 768 423V1010H0Z" fill="#a49070" opacity=".65"/>
<path d="M0 642C100 556 186 541 276 574c97 35 142 99 212 77s146-104 280-67V1120H0Z" fill="url(#land)"/>
<!-- sea western shore: coastal route left side -->
<path d="M0 413C88 449 129 495 135 567c4 81-24 124 18 214 28 60 51 113 38 194-8 44-25 89-18 145H0Z" fill="url(#sea)"/>
<path d="M0 413C88 449 129 495 135 567c4 81-24 124 18 214 28 60 51 113 38 194-8 44-25 89-18 145H0Z" fill="url(#waves)" opacity=".85"/>
<path d="M0 414C86 455 140 509 144 569c5 79-19 120 20 208 38 86 48 138 36 209-7 38-15 79-11 134" fill="none" stroke="#f7dfae" stroke-width="19" opacity=".62"/>
<path d="M0 414C86 455 140 509 144 569c5 79-19 120 20 208 38 86 48 138 36 209-7 38-15 79-11 134" fill="none" stroke="#8c6648" stroke-width="4" opacity=".6"/>
<!-- prominent valley and river -->
<path d="M300 510C425 534 530 577 600 676S637 873 755 1042L768 1120H485c-100-73-108-180-99-286 6-91-67-141-123-207z" fill="#d4b47f" opacity=".66"/>
<path d="M768 668C685 714 703 781 628 837c-93 69-67 156-108 283" fill="none" stroke="#597d83" stroke-width="38" opacity=".35"/>
<path d="M768 668C685 714 703 781 628 837c-93 69-67 156-108 283" fill="none" stroke="#b3bca9" stroke-width="9" opacity=".6"/>
<!-- winding road connects with independent HTML waypoints -->
<path d="M384 244c-27 93 120 136 63 227-60 96-39 155 4 220 42 62 14 153-18 232" fill="none" stroke="#4b3425" stroke-width="32" opacity=".18" stroke-linecap="round"/>
<path d="M384 244c-27 93 120 136 63 227-60 96-39 155 4 220 42 62 14 153-18 232" fill="none" stroke="url(#road)" stroke-width="22" opacity=".74" stroke-linecap="round"/>
<path d="M384 244c-27 93 120 136 63 227-60 96-39 155 4 220 42 62 14 153-18 232" fill="none" stroke="#73553c" stroke-width="2.8" stroke-dasharray="5 13" opacity=".9" stroke-linecap="round"/>
<!-- harbor and watch post, intentionally offset from first mission marker -->
<g filter="url(#shadow)" opacity=".92" transform="translate(120 330)">
  <path d="M0 75 28 31 103 31 127 77V135H0Z" fill="url(#wall)" stroke="#5f4535" stroke-width="4"/>
  <path d="m17 33 44-46 51 46z" fill="#795347" stroke="#4e3a32" stroke-width="5"/>
  <rect x="42" y="76" width="27" height="59" rx="13" fill="#5a4338"/>
  <path d="M90 65h16v26H90z" fill="#314550"/>
  <path d="M19 77h15v25H19z" fill="#314550"/>
  <path d="M-24 127h172v18H-24z" fill="#71553d"/>
  <path d="M51-15v-37" stroke="#5b3e30" stroke-width="5"/>
  <path d="M54-54q27-7 39 1v23q-24-7-39 1" fill="#a72f31" stroke="#eacb8c" stroke-width="2"/>
</g>
<!-- seaborne merchant vessel -->
<g transform="translate(40 779)" opacity=".55" stroke="#e1dbb7" stroke-width="4" stroke-linejoin="round">
 <path d="M0 78h143l-25 18H31Z" fill="#654b3b"/>
 <path d="M78 2v84M102 22v64" fill="none"/>
 <path d="M75 7 18 65h57zM106 25l36 45h-36z" fill="#ead4a4" stroke-width="2"/>
</g>
<!-- second landmark, fortified gate -->
<g transform="translate(486 788)" filter="url(#shadow)" opacity=".94">
 <path d="M-120 115V17h50v-46h49v46h83v-46h45v46h47v98z" fill="url(#wall)" stroke="#553c31" stroke-width="5"/>
 <path d="M-136 21h69v-22h-69zm97-53h69v-18h-69zm100 53h73v-22H61z" fill="#805944" stroke="#614433" stroke-width="3"/>
 <path d="M-16 116V43q35-29 70 0v73z" fill="#402e2e" stroke="#f4d8a1" stroke-width="4"/>
 <path d="M-80 40h23v33h-23zM89 40h23v33H89z" fill="#44535b" stroke="#f0d5a0" stroke-width="2"/>
 <path d="M15-50v-73" stroke="#4d342d" stroke-width="6"/>
 <path d="M19-122q44-8 53 12v34q-22-13-53-3z" fill="#a42e31" stroke="#edcc96" stroke-width="3"/>
 <path d="M-149 113h333v22h-333z" fill="#684b38"/>
</g>
<!-- subtle wildlife and vegetation -->
<g fill="none" stroke="#604932" stroke-width="4" opacity=".55">
 <path d="m79 278q12-11 23 0 12-11 24 0m450 130q15-13 29 0 15-13 31 0" stroke-width="3"/>
 <path d="M220 1000q-8-35-1-57m-1 57q-22-42-41-30m41 30q5-43 31-41M304 988q4-30 25-42m-25 42q-14-29-28-28" />
 <path d="M684 1042q-18-39-7-71m7 71q25-44 38-27" />
</g>
<!-- border/film grain, vignette -->
<rect width="768" height="1120" fill="url(#paper)"/>
<rect width="768" height="1120" fill="url(#grain)" opacity=".6"/>
<rect x="13" y="13" width="742" height="1094" rx="14" fill="none" stroke="#fce1ac" stroke-width="3" opacity=".42"/>
<rect x="21" y="21" width="726" height="1078" rx="8" fill="none" stroke="#69462d" stroke-width="1.5" opacity=".3"/>
</svg>