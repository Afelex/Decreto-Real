<linearGradient id="apron" y2="1" x2=".5"><stop stop-color="#e4d6aa"/><stop offset="1" stop-color="#9c9072"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
