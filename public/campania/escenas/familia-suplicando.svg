<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc">
<title id="title">Madre con su hijo pidiendo auxilio</title><desc id="desc">Una mujer con ropa virreinal andina protege a un niño y extiende su mano suplicando que detengan el arresto.</desc>
