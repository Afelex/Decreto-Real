<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Decreto Real — Duelo de cartas</title>
    <meta name="description" content="Un duelo táctico de cartas inspirado en la historia del Perú."/>
    <meta name="theme-color" content="#101c2d"/>
    <!-- No battle video on every route: only preload the visible first frame.
         Hash routes work on GitHub Pages; keep QA/Studio from downloading duel art. -->
    <script>
      (() => {
        const route = location.hash.slice(1).split('?')[0] || '/';
        const poster = route === '/game'
          ? '/Decreto-Real/escenarios/partida-inicial-poster.jpg'
          : route === '/' ? '/Decreto-Real/portada/portada-poster.jpg' : null;
        if (!poster) return;
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = poster;
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      })();
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Lato:wght@400;700&family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Spline Sans", "sans-serif"],
                        display: ["Cinzel", "serif"],
                        body: ["Lato", "sans-serif"],
                        decorative: ["Cinzel Decorative", "cursive"],
                        rpg: ['Cinzel', 'serif'],
                    },
                    colors: {
                        primary: "#D4AF37", 
                        "theme-pink": "#ee2b8c",
                        "background-light": "#F5F5F0",
                        "background-dark": "#0B0C10",
                        "card-dark": "#1A1C23",
                        "panel-dark": "#1a1c23",
                        "card-bg": "#2A2520",
                        "accent-red": "#9E2A2B",
                        "ornate-border": "#8B6F36",
                        'gold-light': '#fdf2d0',
                        'gold-main': '#e5cfa5',
                        'gold-dark': '#9e814d',
                        'bg-dark': '#050505',
                    },
                    backgroundImage: {
                        'ornate-pattern': "url('https://www.transparenttextures.com/patterns/dark-matter.png')",
                        'dark-texture': "linear-gradient(to bottom, #000000cc, #000000cc), url('https://www.transparenttextures.com/patterns/black-scales.png')",
                        'card-glow': "radial-gradient(circle, rgba(255,215,0,0.3) 0%, rgba(0,0,0,0) 70%)"
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(212, 175, 55, 0.5)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3)',
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'float-delayed': 'float 4s ease-in-out 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                },
            },
        };
    </script>

    <style>
        /* First paint matches the React startup gate, without layout shift. */
        .dr-initial-boot {
            position: fixed; inset: 0; z-index: 1000;
            box-sizing: border-box;
            min-height: 100dvh; padding: 18px;
            display: grid; place-items: center;
            background: #28292c; color: #f4f1e9;
            overflow: auto;
        }
        .dr-initial-boot__content {
            width: min(86vw, 460px);
            display: flex; align-items: center; flex-direction: column;
            gap: clamp(30px, 7dvh, 58px);
        }
        .dr-initial-boot__logo {
            display: block; max-width: 100%; width: min(76vw, 420px);
            height: auto; object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.24));
        }
        .dr-initial-boot__progress {
            position: relative; width: 100%; height: 24px; box-sizing: border-box;
            background: #161718; border: 1px solid #707070; border-radius: 999px;
            overflow: hidden;
        }
        .dr-initial-boot__fill {
            position: absolute; inset: 0 auto 0 0;
            display: block; height: 100%; border-radius: 999px;
            background: linear-gradient(180deg, #bbbbbc, #8d8e91);
            transition: width .15s ease-out;
        }
        .dr-initial-boot__percent {
            position: absolute; inset: 0; display: grid; place-items: center;
            font: 700 12px/1 system-ui, sans-serif;
            letter-spacing: .02em; color: #fff;
            text-shadow: 0 1px 3px #000;
            font-variant-numeric: tabular-nums;
        }
        .dr-initial-boot__sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; border: 0; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap;
        }
        .dr-initial-boot__failure {
            display: flex; flex-direction: column; align-items: center;
            gap: 12px; color: #f4d9d0; text-align: center;
            font: 14px/1.4 system-ui, sans-serif;
        }
        .dr-initial-boot__failure p { margin: 0; }
        .dr-initial-boot__failure button {
            min-height: 44px; padding: 8px 22px;
            border: 1px solid #ababab; border-radius: 7px;
            background: #505156; color: #fff; cursor: pointer;
            font: 700 14px system-ui, sans-serif;
        }
        @media (max-height: 500px) {
            .dr-initial-boot__content { gap: 20px; }
            .dr-initial-boot__logo { width: min(58vw, 300px); max-height: 45dvh; }
        }
        @media (prefers-reduced-motion: reduce) {
            .dr-initial-boot__fill { transition: none; }
        }

        body {
            margin: 0;
            min-height: 100dvh;     /* ocupa pantalla, pero no fuerza 884px */
            overflow-x: hidden;
            overflow-y: auto;       /* permite bajar a los botones */
            background-color: #0B0C10;
        }
        
        .text-shadow-gold {
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .ornate-border {
            border: 2px solid #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
            background: linear-gradient(180deg, rgba(26,28,35,0.95) 0%, rgba(13,14,18,0.95) 100%);
        }
        .btn-ornate {
            background: linear-gradient(to bottom, #5a1a1a, #380e0e);
            border: 2px solid #cfaa56;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .bg-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0"
  }
}
</script>
</head>
<body class="bg-background-dark text-white font-sans">
    <div id="root">
      <main class="dr-initial-boot" aria-label="Cargando Decreto Real">
        <div class="dr-initial-boot__content">
          <img class="dr-initial-boot__logo" src="./portada/decreto-real-logo.png" alt="Decreto Real"/>
          <div class="dr-initial-boot__progress" role="progressbar" aria-label="Preparación del menú principal"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="dr-initial-boot__fill" style="width:0%"></span>
            <strong class="dr-initial-boot__percent">0%</strong>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
