name: Deploy Decreto Real to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-reliable-v2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_MULTIPLAYER_WS_URL: wss://decreto-real-production.up.railway.app
        run: npm run build

      - name: Install FFmpeg for the mobile battle background
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Encode verified H264 faststart loop for GitHub Pages
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source_video="public/escenarios/gemini_generated_video_b8059a5c.mp4"
          optimized_video="dist/escenarios/partida-inicial-loop.mp4"
          test -s "$source_video"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -threads 2 -i "$source_video" \
            -vf "fps=24,scale=480:854:flags=fast_bilinear" \
            -c:v libx264 -preset veryfast -crf 29 \
            -pix_fmt yuv420p -an -movflags +faststart "$optimized_video"
          test -s "$optimized_video"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$optimized_video")"
          test "$codec" = "h264"
          echo "Verified mobile-ready codec: $codec"
          # Produce a frame from the SAME video (not the obsolete clay still).
          # The JPG paints the arena immediately while Android decodes the MP4.
          poster_image="dist/escenarios/partida-inicial-poster.jpg"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -ss 0.6 -i "$optimized_video" -frames:v 1 -q:v 6 "$poster_image"
          test -s "$poster_image"
          ls -lh "$poster_image"
          rm -f dist/escenarios/gemini_generated_video_b8059a5c.mp4
          ls -lh "$optimized_video"

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
