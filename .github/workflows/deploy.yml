name: Deploy Decreto Real to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Optimize initial battle background (bounded)
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source_video="public/escenarios/gemini_generated_video_b8059a5c.mp4"
          optimized_video="dist/escenarios/partida-inicial-loop.mp4"
          test -s "$source_video"
          # Keep the scene animated, but never stall UI releases on video encoding.
          # The runner generally includes ffmpeg. Avoid a slow apt-get update here.
          if command -v ffmpeg >/dev/null 2>&1; then
            if ! timeout -k 5s 90s ffmpeg -hide_banner -loglevel error -nostdin -y \
              -threads 2 -i "$source_video" \
              -vf "fps=24,scale=480:854:flags=fast_bilinear" \
              -c:v libx264 -preset ultrafast -crf 29 \
              -pix_fmt yuv420p -an -movflags +faststart "$optimized_video"; then
              echo "::warning::Optimized background unavailable; using source video for this release."
              cp "$source_video" "$optimized_video"
            fi
          else
            echo "::warning::ffmpeg missing; using source video for this release."
            cp "$source_video" "$optimized_video"
          fi
          test -s "$optimized_video"
          rm -f dist/escenarios/gemini_generated_video_b8059a5c.mp4
          ls -lh "$optimized_video"

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
