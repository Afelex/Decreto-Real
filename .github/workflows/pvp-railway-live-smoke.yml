name: PvP · Railway Live Smoke

on:
  push:
    branches: [main]
    paths:
      - 'multiplayer/server/**'
      - '.github/workflows/pvp-railway-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PvP WebSocket client
        working-directory: multiplayer/server
        run: npm ci --no-audit --no-fund
      - name: Verify live Railway server: 4-character code, 2 clients and a finished duel
        working-directory: multiplayer/server
        run: node remote-smoke.mjs
