name: "Decreto Real · integrar 47 imágenes ya generadas"

on:
  push:
    branches:
      - feat/integrar-arte-47-campania-20261104
    paths:
      - .github/workflows/integrar-arte-campania.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: integrar-arte-47-campania
  cancel-in-progress: false

jobs:
  integrar:
    name: "Importar 47 WebP, probar y guardar en la rama"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: "Recuperar paquete de 47 imágenes, sin llamar a API"
        uses: actions/download-artifact@v4
        with:
          run-id: 41921898124
          name: DECRETO-REAL-47-IMAGENES
          github-token: ${{ github.token }}
          path: art-package
      - name: "Verificar manifiesto y WebP, y copiar las 47 imágenes"
        run: node --experimental-strip-types tools/integrate-campaign-art.mjs
      - name: "Instalar dependencias"
        run: npm ci
      - name: "Verificar lógica y catálogo"
        run: npm test
      - name: "Verificar pantallas y asignación de imágenes"
        run: npm run test:ui
      - name: "Compilar juego con los recursos integrados"
        run: npm run build
      - name: "Confirmar y subir solo las 47 imágenes generadas"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/campania/arte/fondos public/campania/arte/retratos
          count=$(git diff --cached --name-only | grep -c '^public/campania/arte/.*\.webp$')
          echo "Archivos nuevos: $count"
          test "$count" -eq 47
          git commit -m "assets(campania): incorporar 47 WebP generados [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
