name: Decreto Real - Verificacion PvP
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/pvp-amigos-chat-presencia]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias y reglas
        run: |
          npm ci
          npm test
      - name: Compilacion de la web
        run: npm run build
      - name: WebSocket, privacidad y chat
        working-directory: multiplayer/server
        run: |
          npm install --no-audit --no-fund
          node --test socket.test.mjs social.test.mjs
